[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/taidge/novel"
homepage = "https://github.com/taidge/novel"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Markdown
pulldown-cmark = { version = "0.13", features = ["simd"] }
gray_matter = "0.3"

# Syntax highlighting. The precompiled defaults avoid the optional YAML/plist
# loaders and their unmaintained/vulnerable transitive dependencies.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-onig"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# File system
walkdir = "2"
notify = "8"
globset = "0.4"

# Web server
salvo = { version = "0.94.0", default-features = false, features = ["http1", "server", "serve-static", "sse"] }

# Templating
minijinja = { version = "2", features = ["loader", "json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Embedding
rust-embed = "8"

# Alternative template engines
tera = "1"
handlebars = "6"

# Utilities
anyhow = "1"
thiserror = "2"
rayon = "1"
slug = "0.1"
grass = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
regex = "1"
